name: Website correction
description: Report an error, unclear explanation or broken link.
title: "[Correction] "
body:
  - type: input
    id: page
    attributes:
      label: Page or file
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Problem and proposed correction
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Supporting source, if applicable
